<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="theme-color" content="#FAFAF9"/>
  <link rel="canonical" href="https://atlas-scientist.vercel.app/atlas"/>
  <meta property="og:url" content="https://atlas-scientist.vercel.app/atlas"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Atlas AI"/>
  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="Atlas AI"/>
  <script>
    try {
      var t = localStorage.getItem('atlas-theme') || 'system';
      document.documentElement.dataset.theme = t;
    } catch(e) {
      document.documentElement.dataset.theme = 'system';
    }
    // Evict any legacy service workers and CacheStorage that might cache stale JS bundles
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) {
          reg.unregister();
        }
      }).catch(function() {});
    }
    if (typeof window !== 'undefined' && 'caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      }).catch(function() {});
    }
  </script>
  <title>Atlas AI</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
